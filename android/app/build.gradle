apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.lims.builder"
    compileSdk rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }
    defaultConfig {
        applicationId "com.lims.builder"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Three apps from one codebase: full LIMS (default), patient portal, phlebo collections.
    // Web assets must be built with the matching VITE_APP_TARGET before cap sync
    // (see the android:build:* scripts in package.json).
    // Each flavor is a separate Play Store listing, so each keeps its own
    // versionCode/versionName counter. Bump the flavor's own numbers when
    // shipping an update to that listing; the defaultConfig values above only
    // apply to the lims flavor.
    flavorDimensions = ["app"]
    productFlavors {
        lims {
            dimension "app"
            applicationId "com.lims.builder"
        }
        patient {
            dimension "app"
            applicationId "com.anpro.patient"
            versionCode 3
            versionName "1.0.2"
        }
        phlebo {
            dimension "app"
            applicationId "com.anpro.phlebo"
            versionCode 3
            versionName "1.0.2"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    
    // Firebase dependencies
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'

        // google-services.json must contain an entry per applicationId. Skip Firebase
        // processing for flavors not registered yet so their builds still succeed
        // (push notifications won't work in those flavors until they are added in
        // the Firebase console and google-services.json is re-downloaded).
        def registeredPackages = servicesJSON.text
        android.applicationVariants.all { variant ->
            if (!registeredPackages.contains("\"${variant.applicationId}\"")) {
                def taskName = "process${variant.name.capitalize()}GoogleServices"
                tasks.matching { it.name == taskName }.configureEach {
                    it.enabled = false
                    logger.warn("${variant.applicationId} not in google-services.json — Firebase disabled for ${variant.name}")
                }
            }
        }
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=8192"

[functions]
  # Default timeout for all functions (in seconds)
  # Free tier: max 10s, Pro tier: max 26s, Business/Enterprise: max 900s
  # For AI-heavy functions, we need extended timeout
  node_bundler = "esbuild"

# Extended timeout for AI report analysis (requires Pro plan or higher)
[functions."report-to-template"]
  timeout = 60

# PDF Generation Worker - Disabled for dev (use on-demand trigger instead)
# [[functions]]
#   schedule = "*/30 * * * *"
#   name = "pdf-worker"

# Stable patient report links: /r/<token>.pdf -> the report-link resolver, which
# 302s on to whichever copy of the PDF is live (PDF.co temp early, storage once
# uploaded). MUST stay above the SPA catch-alls below -- Netlify matches in order,
# so /* would otherwise swallow /r/* and serve index.html instead.
#
# A 302 (not a 200 proxy) is deliberate: the resolver's own response is itself a
# redirect, and proxying a redirect through Netlify is ill-defined. Two clean hops
# is what every browser and WhatsApp client handles correctly.
[[redirects]]
  from = "/r/*"
  to = "https://api.limsapp.in/functions/v1/report-link/:splat"
  status = 302
  force = true

# SPA fallback
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional proxy to external WhatsApp backend
# If you want to call the backend via relative path (/api/whatsapp),
# set VITE_WHATSAPP_API_BASE_URL="" and enable the proxy below.
# Otherwise, leave this as-is and let the app call the absolute URL directly.
#
# [[redirects]]
#   from = "/api/whatsapp/*"
#   to = "https://lionfish-app-nmodi.ondigitalocean.app/api/whatsapp/:splat"
#   status = 200
#   force = true
